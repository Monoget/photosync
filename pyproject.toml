[project]
name = "photosync"
version = "0.1.0"
description = "Automatically back up Android photos to a Windows PC over Wi-Fi"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["desktop"]
